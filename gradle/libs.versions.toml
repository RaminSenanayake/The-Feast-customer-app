credentials = "1.3.0"
firebaseBom = "34.10.0"
firebaseUiStorage = "9.0.0"
glide = "5.0.5"
googleid = "1.1.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
lombok = "1.18.44"
lottie = "6.6.6"
